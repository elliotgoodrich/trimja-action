name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * SAT'

permissions:
  contents: read

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: node ninjutsu.mjs
      - run: ninja -k 0
      - uses: ./
        with:
          explain: true
          affected: |
            js
            test
          build-configuration: "js"
      - run: ninja -k 0 # Run ninja again to make sure there's nothing to do

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: only-one-job-should-write-to-release-branch-at-one-time
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: 'npm'
      - run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main:main --depth 1
          git merge origin/main --message "Generate files" --log=1 --allow-unrelated-histories --strategy-option theirs
      - run: npm ci
      - run: node ninjutsu.mjs
      - run: ninja -k 0
      - run: |
          git add dist --force
          git commit --amend -C HEAD
      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin
